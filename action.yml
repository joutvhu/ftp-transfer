name: 'FTP Transfer'
description: 'GitHub Action to transfer files and directories to and from an FTP server.'
author: 'Giao Ho'

inputs:
  host:
    description: 'The hostname or IP address of the FTP server.'
    required: true
  port:
    description: 'The port of the FTP server.'
    required: false
    default: '21'
  username:
    description: 'Username for authentication.'
    required: false
    default: 'anonymous'
  password:
    description: 'Password for authentication.'
    required: false
    default: 'anonymous@'
  connTimeout:
    description: 'How long (in milliseconds) to wait for the control connection to be established.'
    required: false
    default: '10000'
  pasvTimeout:
    description: 'How long (in milliseconds) to wait for a PASV data connection to be established.'
    required: false
    default: '10000'
  keepalive:
    description: 'How often (in milliseconds) to send a "dummy" (NOOP) command to keep the connection alive.'
    required: false
    default: '10000'
  commands:
    description: 'Multi-line list of FTP commands to execute sequentially.'
    required: true
  debug:
    description: 'Enable verbose debug output from the FTP client.'
    required: false
    default: 'false'
  throwing:
    description: 'Whether to fail the step if any command execution fails.'
    required: false
    default: 'true'

outputs:
  succeed:
    description: 'Number of commands executed successfully.'
  message:
    description: 'Error message if command execution failed (when throwing is false).'

runs:
  using: 'node24'
  main: 'action/index.js'

branding:
  icon: 'upload-cloud'
  color: 'gray-dark'
